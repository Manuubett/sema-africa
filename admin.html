<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – SemaAfrica</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g h2{font-size:1.6rem;margin-top:4px}
.bars{display:flex;gap:10px;align-items:flex-end;height:190px;background:var(--paper);border-radius:14px;padding:16px}.bars>div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--sea);border-radius:6px 6px 0 0;min-height:2px}.bars small{font-size:.75rem}h3.sec{margin:26px 0 4px;font:700 1.25rem 'Bricolage Grotesque',sans-serif}
details.qz{margin-bottom:10px}details.qz>summary{cursor:pointer}details.qz details{margin:6px 0 6px 16px}</style></head><body>
<div class="kanga"></div>
<div class="app">
  <nav class="side" id="side" aria-label="Admin menu"><a class="logo" href="index.html">Sema<b>Africa</b></a></nav>
  <main class="main wide"><h1 id="title"></h1><p class="msg" id="flash" aria-live="polite"></p><div id="view"><p>Loading…</p></div></main>
</div>
<script>
(function(){
  function f(m){var v=document.getElementById("view"),t=document.getElementById("title");
    if(t){t.textContent="Something went wrong";}
    if(v){v.innerHTML='<div class="empty"><strong></strong><p>Take a screenshot of this message and send it to me. Usual causes: Firestore rules not published, the Firestore database not created, a missing file in the js folder, or wrong Firebase settings.</p></div>';v.querySelector("strong").textContent=m;}}
  addEventListener("unhandledrejection",function(e){f(String(e.reason&&(e.reason.code||e.reason.message)||e.reason))});
  addEventListener("error",function(e){f(e.message||"A script failed to load")});
})();
</script>
<script type="module">
import {auth,db,HOME} from "./js/firebase.js";
import * as FB from "./js/firebase.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,collection,getDocs,addDoc,setDoc,updateDoc,deleteDoc,writeBatch,Timestamp,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const SERVER_URL=(FB.SERVER_URL||"").trim().replace(/\/+$/,"");
// Booked lessons are cancelled on the server so the student gets their lesson back. Render's free plan can take a minute to wake up.
async function staffCancel(id){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),75000);
  try{
    const r=await fetch(SERVER_URL+"/api/lessons/staff-cancel",{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+await auth.currentUser.getIdToken()},body:JSON.stringify({lessonId:id})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"Could not cancel");
    return d;
  }catch(e){
    if(e.name==="AbortError")throw new Error("The server took too long to answer. Wait a minute, then check the list before trying again.");
    throw e;
  }finally{clearTimeout(t)}
}
// A teacher or admin sends a reminder by hand. The server checks who may remind which lesson.
async function notifyLessons(ids,note){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),75000);
  try{
    const r=await fetch(SERVER_URL+"/api/reminders/notify",{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+await auth.currentUser.getIdToken()},body:JSON.stringify({lessonIds:ids,note})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"Could not send");
    const sk=d.skipped||[];
    return d.sent+" reminder"+(d.sent===1?"":"s")+" sent"+(sk.length?". Skipped "+sk.length+": "+[...new Set(sk.map(x=>x.reason))].join("; "):"")+".";
  }catch(e){if(e.name==="AbortError")throw new Error("The server took too long to answer. Wait a minute, then try again.");throw e}finally{clearTimeout(t)}
}
const $=id=>document.getElementById(id), view=$("view");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=v=>v&&v.toDate?v.toDate():null, fd=v=>{const d=dt(v);return d?d.toLocaleDateString([],{day:"numeric",month:"short",year:"numeric"}):"–"};
const money=(a,c)=>(c==="KES"?"KES ":"$")+Number(a||0).toLocaleString();
const empty=(t,p)=>`<div class="empty"><strong>${t}</strong><p>${p}</p></div>`;
const bt=(a,id,t,line=true,x="")=>`<button class="btn sm ${line?"line":""}" data-act="${a}" data-id="${id}" ${x}>${t}</button>`;
let uid,users=[],courses=[],enr=[],pays=[],lessons=[],codes=[],quizzes=[],attempts=[],qErr=false,cur="overview",editC="",repCur="USD",plans=[],plErr=false,editP="",selB=new Set(),remOff=[1440,60],remErr=false;
const students=()=>users.filter(u=>u.role==="student");
function flash(t,ok=true){$("flash").className="msg "+(ok?"ok":"err");$("flash").textContent=t}
async function load(){
  const all=c=>getDocs(collection(db,c)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
  // Quiz collections load safely so the rest of the admin page still works if their rules are not published yet
  qErr=false;const safe=c=>all(c).catch(()=>{qErr=true;return[]});
  [users,courses,enr,pays,lessons,codes]=await Promise.all(["users","courses","enrollments","payments","lessons","discountCodes"].map(all));
  [quizzes,attempts]=await Promise.all([safe("quizzes"),safe("quizAttempts")]);
  // Lesson plans load safely too, so the page still works before their rules are published
  plErr=false;try{plans=(await all("curriculum")).sort((a,b)=>(a.courseNo||0)-(b.courseNo||0)||(a.topicNo||0)-(b.topicNo||0))}catch{plans=[];plErr=true}
  remErr=false;try{const s=await getDoc(doc(db,"settings","reminders"));remOff=s.exists()&&Array.isArray(s.data().offsets)?s.data().offsets:[1440,60]}catch{remOff=[1440,60];remErr=true}
  const ms=x=>(x&&x.toMillis)?x.toMillis():0;
  quizzes.sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  attempts.sort((a,b)=>ms(b.date)-ms(a.date));
}
async function refresh(m){await load();show(cur);if(m)flash(m)}

// ── Lesson plans: reading a topic document ──
const LV=["All levels","A1 Beginner","A2 Elementary","B1 Intermediate","B2 Upper intermediate"];
const tc=s=>s.toLowerCase().replace(/(^|[^a-z'’])([a-z])/g,(m,a,b)=>a+b.toUpperCase());          // Title Case
const sc=s=>{s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1).replace(/\(([a-z])/g,(m,c)=>"("+c.toUpperCase())};   // Sentence case
const mapLevel=t=>/beginner/i.test(t)?LV[1]:/elementary/i.test(t)?LV[2]:/upper/i.test(t)?LV[4]:/intermediate/i.test(t)?LV[3]:LV[0];
// Finds "COURSE 2: …", "TOPIC 1: …", "Level: …" and every "LESSON n: …" heading in the pasted text
function parseDoc(t){
  const cm=t.match(/^#{1,4}\s*COURSE\s*(\d+)\s*[:.\-–—]\s*(.+)$/im),tm=t.match(/^#{1,4}\s*TOPIC\s*(\d+)\s*[:.\-–—]\s*(.+)$/im),lv=t.match(/\*{0,2}Level:?\*{0,2}:?\s*(.+)$/im);
  const lessons=[...t.matchAll(/^#{1,4}\s*LESSON\s*(\d+)\s*[:.\-–—]\s*(.+)$/gim)].map(m=>({no:+m[1],title:sc(m[2].trim())}));
  return {courseNo:cm?+cm[1]:"",course:cm?tc(cm[2].trim()):"",topicNo:tm?+tm[1]:"",topic:tm?tc(tm[2].trim()):"",level:lv?lv[1].trim():"",lessons};
}
// "1. Saying your name" lines back into lessons
const parseLessons=t=>t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((x,i)=>{const m=x.match(/^(\d+)\s*[.\-:|)]*\s*(.+)$/);return m?{no:+m[1],title:m[2].trim()}:{no:i+1,title:x}});

// Names for Courses and pricing come from the lesson plans, so they are picked, not typed
const nameOpts=()=>{const cs=[...new Set(plans.map(p=>p.course))];
  return `<optgroup label="Courses">${cs.map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup>`+
   plans.map(p=>`<optgroup label="${esc(p.course+" · Topic "+(p.topicNo||"–")+": "+p.topic)}"><option>${esc(p.topic)}</option>${(p.lessons||[]).map(l=>`<option value="${esc(p.topic+" · Lesson "+l.no+": "+l.title)}">Lesson ${l.no}: ${esc(l.title)}</option>`).join("")}</optgroup>`).join("")};
const PAGES={
overview:["Overview",()=>{
  const now=new Date(),mk=d=>d.getFullYear()+"-"+d.getMonth();
  const mp=pays.filter(p=>dt(p.createdAt)&&mk(dt(p.createdAt))===mk(now));
  const rev=["USD","KES"].map(c=>money(mp.filter(p=>p.currency===c).reduce((a,p)=>a+ +p.amount,0),c)).join(" + ");
  const up=lessons.filter(l=>["open","booked"].includes(l.status)&&dt(l.start)>now).length;
  return `<div class="g">${[["Students",students().length],["Teachers",users.filter(u=>u.role==="teacher").length],["Active enrolments",enr.filter(e=>e.status==="active").length],["Upcoming lessons",up],["Revenue this month",rev]].map(([a,b])=>`<div class="card"><small>${a}</small><h2>${b}</h2></div>`).join("")}</div>`}],

users:["Students and teachers",()=>`<div class="form"><label>Search<input id="q" placeholder="Name or email"></label><label>Show<select id="rf"><option value="">Everyone</option><option value="student">Students</option><option value="teacher">Teachers</option><option value="admin">Admins</option></select></label></div><div id="ul"></div>`,
 ()=>{const rb=(id,r,t)=>`<button class="btn sm line" data-act="role" data-id="${id}" data-r="${r}">${t}</button>`;
  const draw=()=>{const q=$("q").value.toLowerCase(),f=$("rf").value;
   const l=users.filter(u=>(!f||u.role===f)&&((u.name||"")+(u.email||"")).toLowerCase().includes(q));
   $("ul").innerHTML=l.length?l.map(u=>`<div class="row"><div><strong>${esc(u.name)}</strong> <span class="pill">${esc(u.role)}</span><small>${esc(u.email)} · ${esc(u.goal||"")} · joined ${fd(u.createdAt)}</small></div>
    <div class="acts">${u.id===uid?"<small>You</small>":u.role==="student"?rb(u.id,"teacher","Make teacher"):u.role==="teacher"?rb(u.id,"student","Make student"):""}</div></div>`).join(""):empty("No one found","Try another search.")};
  $("q").oninput=draw;$("rf").onchange=draw;draw()}],

courses:["Courses and pricing",()=>{const c=courses.find(x=>x.id===editC)||{};
  return `<form class="form" id="cF">${plans.length?`<label>Pick a name from your lesson plans<select id="cnp"><option value="">Choose a name…</option>${nameOpts()}</select></label>`:""}
  <label>Name shown to students<input id="cn" required value="${esc(c.name)}" placeholder="Pick one above, or type your own"></label>
  <label>Type<select id="ct">${["Trial","Single","Monthly"].map(t=>`<option ${c.type===t?"selected":""}>${t}</option>`).join("")}</select></label>
  <label>Lessons included<input id="cl" type="number" min="1" value="${c.lessons||1}"></label>
  <label>Minutes each<select id="cm"><option ${c.minutes==25?"selected":""}>25</option><option ${c.minutes==25?"":"selected"}>45</option></select></label>
  <label>Price USD (0 = free trial)<input id="cu" type="number" min="0" step="0.01" value="${c.usd??0}"></label>
  <label>Price KES (0 = free trial)<input id="ck" type="number" min="0" value="${c.kes??0}"></label>
  <button class="btn">${editC?"Save changes":"Add course"}</button>${editC?bt("canc","","Cancel edit"):""}</form>`+
  (courses.length?courses.map(c=>`<div class="row"><div><strong>${esc(c.name)}</strong> <span class="pill">${esc(c.type)}</span> ${c.active===false?'<span class="pill">Hidden</span>':""}<small>${c.lessons} × ${c.minutes} min · ${Number(c.kes)>0?"$"+c.usd+" / KES "+Number(c.kes).toLocaleString():"Free"}</small></div>
   <div class="acts">${bt("editc",c.id,"Edit")}${bt("togc",c.id,c.active===false?"Show":"Hide")}${bt("delc",c.id,"Delete")}</div></div>`).join(""):empty("No courses yet","Add your first course, or load the four launch plans.")+bt("seed","","Add the four launch plans",false))},
 ()=>{if($("cnp"))$("cnp").onchange=e=>{if(e.target.value)$("cn").value=e.target.value};
  $("cF").onsubmit=async e=>{e.preventDefault();
   const d={name:$("cn").value.trim(),type:$("ct").value,lessons:+$("cl").value,minutes:+$("cm").value,usd:+$("cu").value||0,kes:+$("ck").value||0};
   // Only a Trial can be free. Single and Monthly plans must have a price in both currencies.
   if(d.type!=="Trial"&&(!(d.usd>0)||!(d.kes>0)))return flash("Single and Monthly plans need a price in USD and KES.",false);
   if(editC){await updateDoc(doc(db,"courses",editC),d)}else{await addDoc(collection(db,"courses"),{...d,active:true,createdAt:serverTimestamp()})}
   editC="";await refresh("Course saved. Prices update here only; the public page still shows fixed prices.")}}],

plans:["Lesson plans",()=>{const p=plans.find(x=>x.id===editP)||{};
  const byC={};plans.forEach(x=>(byC[x.course]=byC[x.course]||[]).push(x));
  return (plErr?`<p class="msg err">Lesson plans could not be loaded. Publish the Firestore rules for curriculum.</p>`:"")+
  `<p>These are the topics your teachers teach. Add a topic once, and teachers pick its lessons by name when they add a time slot. Prices and plans stay under Courses and pricing.</p>
  <form class="form" id="plF"><label class="full"><strong>${editP?"Edit topic":"Add a topic"}</strong></label>
  <label class="full">Paste a topic document (optional)<textarea id="plD" rows="5" placeholder="Paste the document, or choose a .md or .txt file below, then tap Read it"></textarea></label>
  <div class="acts full"><button class="btn line sm" type="button" id="plRead">Read it</button><input type="file" id="plFile" accept=".md,.txt,text/plain,text/markdown"></div>
  <label>Course name<input id="plC" required value="${esc(p.course)}" placeholder="e.g. Practical Kiswahili"></label>
  <label>Course number<input id="plCn" type="number" min="0" value="${p.courseNo??""}"></label>
  <label>Topic name<input id="plT" required value="${esc(p.topic)}" placeholder="e.g. Introducing yourself"></label>
  <label>Topic number<input id="plTn" type="number" min="0" value="${p.topicNo??""}"></label>
  <label>Level<select id="plL">${LV.map(l=>`<option ${l===(p.level||"All levels")?"selected":""}>${l}</option>`).join("")}</select></label>
  <label class="full">Lessons, one per line<textarea id="plLs" rows="8" placeholder="1. Saying your name">${esc((p.lessons||[]).map(l=>l.no+". "+l.title).join("\n"))}</textarea></label>
  <div class="acts full"><button class="btn">${editP?"Save changes":"Save topic"}</button>${editP?bt("canp","","Cancel edit"):""}</div></form>`+
  (plans.length?Object.entries(byC).map(([c,ts])=>`<h3 class="sec">${ts[0].courseNo?"Course "+ts[0].courseNo+": ":""}${esc(c)}</h3>`+ts.map(x=>`<div class="row"><div><strong>Topic ${x.topicNo||"–"}: ${esc(x.topic)}</strong> <span class="pill">${esc(x.level||"All levels")}</span> ${x.active===false?'<span class="pill">Hidden</span>':""}<small>${(x.lessons||[]).length} lessons: ${(x.lessons||[]).map(l=>l.no+". "+esc(l.title)).join(" · ")}</small></div>
   <div class="acts">${bt("editp",x.id,"Edit")}${bt("togp",x.id,x.active===false?"Show":"Hide")}${bt("delp",x.id,"Delete")}</div></div>`).join("")).join(""):empty("No topics yet","Paste your first topic document above, or type one in."))},
 ()=>{
  const fill=()=>{const r=parseDoc($("plD").value);
    if(!r.lessons.length&&!r.topic)return flash("I could not find any COURSE, TOPIC or LESSON headings in that text.",false);
    if(r.course)$("plC").value=r.course;if(r.courseNo!=="")$("plCn").value=r.courseNo;
    if(r.topic)$("plT").value=r.topic;if(r.topicNo!=="")$("plTn").value=r.topicNo;
    if(r.level)$("plL").value=mapLevel(r.level);
    if(r.lessons.length)$("plLs").value=r.lessons.map(l=>l.no+". "+l.title).join("\n");
    flash("Read "+r.lessons.length+" lesson"+(r.lessons.length===1?"":"s")+". Check the names, then Save.")};
  $("plRead").onclick=fill;
  $("plFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("plD").value=String(rd.result||"");fill()};rd.readAsText(f);e.target.value=""};
  $("plF").onsubmit=async e=>{e.preventDefault();
   const lessons=parseLessons($("plLs").value);
   const d={course:$("plC").value.trim(),courseNo:+$("plCn").value||0,topic:$("plT").value.trim(),topicNo:+$("plTn").value||0,level:$("plL").value,lessons};
   if(!d.course||!d.topic)return flash("Give the course and the topic a name.",false);
   if(!lessons.length)return flash("Add at least one lesson.",false);
   if(new Set(lessons.map(l=>l.no)).size!==lessons.length)return flash("Two lessons have the same number.",false);
   if(plans.some(x=>x.id!==editP&&x.courseNo===d.courseNo&&x.topicNo===d.topicNo&&x.course.toLowerCase()===d.course.toLowerCase()))return flash("That topic already exists. Edit it instead.",false);
   if(editP)await updateDoc(doc(db,"curriculum",editP),d);else await addDoc(collection(db,"curriculum"),{...d,active:true,createdAt:serverTimestamp()});
   editP="";await refresh("Topic saved. Teachers can now pick its lessons when they add a time slot.")}}],

pay:["Subscriptions and payments",()=>{
  const ac=courses.filter(c=>c.active!==false);
  return `<form class="form" id="pF"><label class="full"><strong>Enrol a student and record their payment</strong></label>
  <label>Student<select id="ps" required><option value="">Choose…</option>${students().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label>
  <label>Course<select id="pc" required><option value="">Choose…</option>${ac.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
  <label>Currency<select id="pu"><option>USD</option><option>KES</option></select></label>
  <label>Amount paid<input id="pa" type="number" min="0" step="0.01" required></label>
  <label>Method<select id="pm"><option>M-Pesa</option><option>Card</option><option>Cash</option><option>Bank transfer</option></select></label>
  <label>Reference<input id="pr" placeholder="M-Pesa code, receipt no."></label><button class="btn">Enrol and record payment</button></form>
  <h3 class="sec">Enrolments</h3>`+(enr.length?[...enr].sort((a,b)=>(dt(b.startDate)||0)-(dt(a.startDate)||0)).map(e=>`<div class="row"><div><strong>${esc(e.userName)}</strong> <span class="pill">${esc(e.status)}</span><small>${esc(e.courseName)} · started ${fd(e.startDate)}${e.expiresAt?" · ends "+fd(e.expiresAt):""} · ${e.lessonsLeft} of ${e.lessonsTotal} lessons left</small></div>
   <div class="acts">${e.status==="active"?bt("enst",e.id,"Mark expired",true,'data-s="expired"')+bt("enst",e.id,"Cancel",true,'data-s="cancelled"'):bt("enst",e.id,"Reactivate",true,'data-s="active"')}</div></div>`).join(""):empty("No enrolments yet","Enrol your first student above."))+
  `<h3 class="sec">Payments</h3>`+(pays.length?[...pays].sort((a,b)=>(dt(b.createdAt)||0)-(dt(a.createdAt)||0)).slice(0,30).map(p=>`<div class="row"><div><strong>${money(p.amount,p.currency)}</strong> · ${esc(p.userName)}<small>${esc(p.courseName)} · ${esc(p.method)} ${esc(p.reference||"")} · ${fd(p.createdAt)}</small></div></div>`).join(""):empty("No payments yet","Recorded payments appear here."))},
 ()=>{const fill=()=>{const c=courses.find(x=>x.id===$("pc").value);$("pa").value=c?($("pu").value==="USD"?c.usd:c.kes):""};
  $("pc").onchange=$("pu").onchange=fill;
  $("pF").onsubmit=async e=>{e.preventDefault();const s=users.find(u=>u.id===$("ps").value),c=courses.find(x=>x.id===$("pc").value);if(!s||!c)return;
   const now=new Date(),end=new Date(now);end.setDate(end.getDate()+30),b=writeBatch(db);
   b.set(doc(collection(db,"enrollments")),{userId:s.id,userName:s.name,courseId:c.id,courseName:c.name,type:c.type,lessonsTotal:c.lessons,lessonsLeft:c.lessons,status:"active",startDate:Timestamp.fromDate(now),expiresAt:c.type==="Monthly"?Timestamp.fromDate(end):null});
   b.set(doc(collection(db,"payments")),{userId:s.id,userName:s.name,courseId:c.id,courseName:c.name,amount:+$("pa").value,currency:$("pu").value,method:$("pm").value,reference:$("pr").value.trim(),createdAt:serverTimestamp()});
   await b.commit();await refresh(s.name+" is enrolled and the payment is recorded.")}}],

bookings:["Bookings",()=>`<div class="form"><label>Show<select id="bf"><option value="">All</option><option value="open">Open slots</option><option value="booked">Booked</option><option value="attended">Attended</option><option value="absent">Absent</option><option value="cancelled">Cancelled</option></select></label></div>
  <div class="acts" id="bbar" style="margin:12px 0"><label class="chk"><input type="checkbox" id="ball"> Select all shown</label><small id="bcnt">None selected</small>${bt("bremind","","Remind selected")}${bt("bcancel","","Cancel selected")}${bt("bdel","","Delete selected",false)}</div>
  <div id="bl"></div>`,
 ()=>{
  const match=()=>{const f=$("bf").value;return lessons.filter(x=>!f||x.status===f).sort((a,b)=>dt(b.start)-dt(a.start))};
  const rows=()=>match().slice(0,100);
  const upd=()=>{const n=selB.size,shown=rows();$("bcnt").textContent=n?n+" selected":"None selected";
    $("ball").checked=!!shown.length&&shown.every(x=>selB.has(x.id));
    $("bbar").querySelectorAll("[data-act]").forEach(b=>b.disabled=!n)};
  const draw=()=>{const l=rows();
   $("bl").innerHTML=l.length?l.map(x=>`<div class="row"><div><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-sel="${x.id}" ${selB.has(x.id)?"checked":""} style="width:auto;flex:none;margin-top:5px" aria-label="Select this lesson"><span><strong>${dt(x.start).toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</strong> <span class="pill">${esc(x.status)}</span>
    <small>Teacher ${esc(x.teacherName||"–")} · Student ${esc(x.studentName||"none yet")} · ${esc(x.courseName||x.type)}${x.topic?" · "+esc(x.topic):""} · ${x.duration} min</small></span></label></div>
    <div class="acts">${x.status==="booked"?bt("remind",x.id,"Remind"):""}${["open","booked"].includes(x.status)?bt("cancl",x.id,"Cancel lesson"):""}</div></div>`).join("")+(match().length>100?'<p><small>Showing the latest 100. Use the filter above to narrow the list.</small></p>':""):empty("No bookings","Lessons teachers add appear here.");
   upd()};
  $("bf").onchange=()=>{selB.clear();draw()};
  $("ball").onchange=e=>{rows().forEach(x=>e.target.checked?selB.add(x.id):selB.delete(x.id));draw()};
  $("bl").onchange=e=>{const id=e.target.dataset.sel;if(!id)return;e.target.checked?selB.add(id):selB.delete(id);upd()};
  draw()}],

remsettings:["Reminder settings",()=>{

  `<p>Students are reminded by email and WhatsApp (whichever they switched on) at each time you tick. You can tick up to four. Teachers and admins can also send a reminder by hand with the <strong>Remind</strong> buttons.</p>
  <form class="form" id="rmF">${PRE.map(([m,t])=>`<label class="chk"><input type="checkbox" data-m="${m}" ${remOff.includes(m)?"checked":""}> ${t}</label>`).join("")}

  <div class="form"><label>Search<input id="zq" placeholder="Quiz, teacher or student name"></label></div><div id="zl"></div>`},

  const tn=z=>(users.find(u=>u.id===z.teacherId)||{}).name||"Unknown teacher";
  const pc=a=>a.total?Math.round(a.score/a.total*100):0;
  const pick=(q,a)=>(a&&a.length)?a.map(i=>esc(q.options[i]??"?")).join(", "):"No answer";
  const det=(z,a)=>(z.questions||[]).map((q,i)=>{const ans=(a.answers&&a.answers[i])||[];const ok=ans.length===q.correct.length&&q.correct.every(c=>ans.includes(c));
    return `<p><strong>${i+1}. ${esc(q.text)}</strong> ${ok?"✓":"✗"}<br><small>Answered: ${pick(q,ans)}${ok?"":" · Correct: "+pick(q,q.correct)}</small></p>`}).join("");
  const draw=()=>{const q=$("zq").value.trim().toLowerCase();
   const l=quizzes.filter(z=>!q||(z.title+" "+tn(z)).toLowerCase().includes(q)||attempts.some(a=>a.quizId===z.id&&(a.studentName||"").toLowerCase().includes(q)));
   $("zl").innerHTML=l.length?l.map(z=>{const at=attempts.filter(a=>a.quizId===z.id),av=at.length?Math.round(at.reduce((s,a)=>s+pc(a),0)/at.length):0,n=(z.questions||[]).length;
    return `<details class="qz row" style="display:block"><summary><strong>${esc(z.title)}</strong> <span class="pill">${esc(z.level||"All levels")}</span><small>Teacher ${esc(tn(z))} · ${z.studentName?esc(z.studentName):"All students"} · ${n} question${n===1?"":"s"} · ${at.length} attempt${at.length===1?"":"s"}${at.length?" · average "+av+"%":""}</small></summary>`+
     (at.length?at.map(a=>`<details><summary>${esc(a.studentName||"Student")} · ${a.score}/${a.total} (${pc(a)}%) · ${fd(a.date)}</summary>${det(z,a)}</details>`).join(""):"<p><small>No attempts yet.</small></p>")+`</details>`}).join(""):empty("No quizzes found",quizzes.length?"Try another search.":"Quizzes teachers create will appear here.")};
  $("zq").oninput=draw;draw()}],

const SEED=[["Trial lesson","Trial",1,25,5,650],["Single lesson","Single",1,45,12,1500],["4 lessons a month","Monthly",4,45,40,5000],["8 lessons a month","Monthly",8,45,75,9500]];
// Runs one admin action over several lessons. A booked lesson goes through the server first, so its student gets the lesson back.
async function bulkRun(ls,mode){
  let refunded=0,failed=0,deleted=0,cancelled=0,first="";
  const direct=[];
  for(const [i,l] of ls.entries()){
    try{
      if(l.status==="booked"){
        flash("Working… "+(i+1)+" of "+ls.length+". The server can take up to a minute to wake up. Please don't click again.");
        await staffCancel(l.id);refunded++;
        if(mode==="delete")direct.push(l.id);else cancelled++;
      }else if(mode==="cancel"){
        if(l.status==="open"){await updateDoc(doc(db,"lessons",l.id),{status:"cancelled",cancelledBy:"admin"});cancelled++}
      }else direct.push(l.id);
    }catch(x){failed++;first=first||(x&&x.message)||String(x)}
  }
  if(direct.length){
    try{
      for(let i=0;i<direct.length;i+=400){const wb=writeBatch(db);direct.slice(i,i+400).forEach(id=>wb.delete(doc(db,"lessons",id)));await wb.commit()}
      deleted=direct.length;
      // meeting links belong to the lessons; remove them too (this needs the lessonLinks admin rule, so a failure is not fatal)
      for(const id of direct){try{await deleteDoc(doc(db,"lessonLinks",id))}catch{}}
    }catch(x){failed+=direct.length;first=first||(x&&x.message)||String(x)}
  }
  const n=mode==="delete"?deleted:cancelled;
  return n+" lesson"+(n===1?"":"s")+(mode==="delete"?" deleted":" cancelled")+(refunded?". "+refunded+" returned to students":"")+(failed?". "+failed+" could not be done"+(first?": "+first.replace(/\.+$/,""):""):"")+".";
}

 async cancl(b){const l=lessons.find(x=>x.id===b.dataset.id);if(!l){b.disabled=false;return}

     // a booked lesson is cancelled on the server so the student gets the lesson back

     flash("Cancelling… the server can take up to a minute to wake up.");
     await staffCancel(l.id);await refresh("Lesson cancelled. The student got their lesson back.");return}
   if(!confirm("Cancel this open slot?")){b.disabled=false;return}
   await updateDoc(doc(db,"lessons",l.id),{status:"cancelled"});await refresh()},
 async bcancel(b){const ls=[...selB].map(id=>lessons.find(x=>x.id===id)).filter(l=>l&&["open","booked"].includes(l.status));
   if(!ls.length){flash("Only open or booked lessons can be cancelled. Nothing to do.",false);b.disabled=false;return}
   const bk=ls.filter(l=>l.status==="booked").length;
   if(bk&&!SERVER_URL){flash("Cancelling booked lessons needs the server, which is not set up.",false);b.disabled=false;return}
   if(!confirm("Cancel "+ls.length+" lesson"+(ls.length>1?"s":"")+"?"+(bk?" "+bk+" "+(bk>1?"are":"is")+" booked: those students get their lesson back.":"")+" Lessons that are not open or booked are skipped.")){b.disabled=false;return}
   const msg=await bulkRun(ls,"cancel");selB.clear();await refresh(msg)},
 async bdel(b){const ls=[...selB].map(id=>lessons.find(x=>x.id===id)).filter(Boolean);
   if(!ls.length){b.disabled=false;return}
   const bk=ls.filter(l=>l.status==="booked").length,fin=ls.filter(l=>["attended","absent"].includes(l.status)).length;
   if(bk&&!SERVER_URL){flash("Deleting booked lessons needs the server, so students get their lesson back. Untick the booked ones, or set the server up.",false);b.disabled=false;return}
   if(!confirm("Delete "+ls.length+" lesson"+(ls.length>1?"s":"")+" permanently?"+(bk?"\n• "+bk+" booked: those students get their lesson back first.":"")+(fin?"\n• "+fin+" attended or absent: their attendance record is removed.":"")+"\nThis cannot be undone.")){b.disabled=false;return}
   const msg=await bulkRun(ls,"delete");selB.clear();await refresh(msg)},
 async remind(b){const l=lessons.find(x=>x.id===b.dataset.id);if(!l){b.disabled=false;return}
   if(!SERVER_URL){flash("The server is not set up.",false);b.disabled=false;return}
   const note=prompt("Send a reminder to "+(l.studentName||"the student")+" now.\nAdd a short note if you like, or leave it empty:","");
   if(note===null){b.disabled=false;return}
   flash("Sending… the server can take up to a minute to wake up.");flash(await notifyLessons([l.id],note.trim()));b.disabled=false},
 async bremind(b){const ids=[...selB].filter(id=>{const l=lessons.find(x=>x.id===id);return l&&l.status==="booked"});
   if(!ids.length){flash("Select at least one booked lesson to remind.",false);b.disabled=false;return}
   if(!SERVER_URL){flash("The server is not set up.",false);b.disabled=false;return}
   const note=prompt("Send a reminder to the students of "+ids.length+" booked lesson"+(ids.length>1?"s":"")+" now.\nAdd a short note if you like, or leave it empty:","");
   if(note===null){b.disabled=false;return}
   flash("Sending… the server can take up to a minute to wake up.");const msg=await notifyLessons(ids,note.trim());selB.clear();await refresh(msg)},
 async enst(b){await updateDoc(doc(db,"enrollments",b.dataset.id),{status:b.dataset.s});await refresh()},
 async togk(b){const k=codes.find(x=>x.id===b.dataset.id);await updateDoc(doc(db,"discountCodes",k.id),{active:!k.active});await refresh()},

};
