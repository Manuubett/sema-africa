<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355B">
<title>My learning – SemaAfrica</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Mobile-first student dashboard. Self-contained: does not need app.css. */
:root{
  --paper:#F5F6FA;--card:#FFFFFF;--ink:#14213A;--muted:#5D6A82;--line:#DDE2EC;
  --brand:#12355B;--brand-ink:#FFFFFF;--sun:#F2B01E;--leaf:#1B8A5A;--rose:#C2374F;
  --tab-h:64px;--r:16px;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1626;--card:#16223A;--ink:#EEF2FA;--muted:#9AA7C0;--line:#26344F;
  --brand:#8FB8F0;--brand-ink:#0E1626;--sun:#F5BE3F;--leaf:#4FCB8F;--rose:#F0788D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px)}
a{color:var(--brand);font-weight:700}
small{display:block;color:var(--muted);font-size:.84rem;line-height:1.4}
h1,h2,h3{margin:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:repeating-linear-gradient(90deg,var(--sun) 0 18px,var(--leaf) 18px 36px,var(--rose) 36px 54px,var(--brand) 54px 72px)}
.logo{font:800 1.25rem var(--display);color:inherit;text-decoration:none;letter-spacing:-.01em}
.logo b{color:var(--sun)}
.chip{font:700 .85rem var(--body);background:rgba(255,255,255,.16);color:inherit;border-radius:99px;padding:5px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){.chip{background:rgba(14,22,38,.14)}}

/* page */
.main{max-width:640px;margin:0 auto;padding:22px 16px 8px}
#title{font:800 1.75rem/1.15 var(--display);letter-spacing:-.02em;margin-bottom:14px}
.msg{margin:0 0 12px;min-height:0;font-weight:700}
.msg:empty{display:none}
.msg.ok,.msg.err{padding:12px 14px;border-radius:12px;font-size:.95rem}
.msg.ok{background:color-mix(in srgb,var(--leaf) 16%,var(--card));color:var(--ink);border:1px solid var(--leaf)}
.msg.err{background:color-mix(in srgb,var(--rose) 14%,var(--card));color:var(--ink);border:1px solid var(--rose)}
#view>p{margin:0 0 14px}

/* cards, rows */
.card,.row,.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card{padding:16px}
.card h2{font:800 1.5rem/1.2 var(--display);margin-top:4px}
.g{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:14px}
.g .card.wide{grid-column:1/-1}
.row{display:flex;flex-direction:column;gap:12px;padding:14px;margin-bottom:10px}
.row strong{font-weight:700}
.row .pill{vertical-align:middle}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .btn{flex:1 1 auto}
.row>.btn{width:100%}
h3.sec{font:700 1.2rem var(--display);margin:26px 0 10px}
.pill{display:inline-block;font:700 .75rem/1 var(--body);padding:5px 9px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,var(--card));color:var(--ink);margin-left:4px}
.empty{padding:22px 18px;text-align:left;border-style:dashed}
.empty strong{display:block;font:700 1.15rem var(--display);margin-bottom:4px}
.empty p{margin:0 0 14px;color:var(--muted)}

/* hero: next class */
.hero{background:var(--brand);color:var(--brand-ink);border:0;padding:20px 18px;border-radius:20px;position:relative;overflow:hidden}
.hero small{color:inherit;opacity:.8}
.hero h2{font:800 1.8rem/1.15 var(--display);margin:6px 0 16px;letter-spacing:-.02em}
.hero .btn{background:var(--sun);color:#14213A;border-color:var(--sun);width:100%}
.hero a:not(.btn){color:var(--sun)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.14) 0 6px,transparent 6px 14px);pointer-events:none}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;
  border:2px solid var(--brand);border-radius:12px;background:var(--brand);color:var(--brand-ink);
  font:700 1rem var(--body);text-decoration:none;cursor:pointer;text-align:center}
.btn.line{background:transparent;color:var(--brand)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.95rem}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.quick{display:grid;gap:10px;margin-top:16px}

/* catalogue */
.cat{display:grid;gap:12px}
.course{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.course .pill{margin-left:0}
.course h3{font:700 1.25rem var(--display)}
.pr{font:800 1.7rem var(--display)}
.pr small{display:inline;font:600 .85rem var(--body);color:var(--muted)}
.course .btn{width:100%;margin-top:6px}

/* forms */
.form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700}
input[type=text],input[type=tel],input:not([type]){width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font:400 1rem var(--body)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.form label:has(input[type=checkbox]){display:flex;gap:12px;align-items:center;min-height:44px;font-weight:600}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:700 .72rem var(--body);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:6px 2px;cursor:pointer;position:relative}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=true]{color:var(--brand)}
.tabs button[aria-current=true]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--sun)}

/* sheets (dialogs) */
dialog{border:0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:90dvh;overflow:auto;
  margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,26,.6)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
dialog h2{font:800 1.4rem var(--display)}
dialog .btn{margin-top:4px}
.more{display:grid;gap:8px;margin-top:12px}
.more button{appearance:none;width:100%;text-align:left;min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);font:700 1rem var(--body);cursor:pointer}
.more button[aria-current=true]{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.more .out{color:var(--rose);margin-top:6px}
@media (min-width:600px){
  dialog{margin:auto;border-radius:22px}
  .cat{grid-template-columns:1fr 1fr}
  .row{flex-direction:row;align-items:center;justify-content:space-between}
  .row>.btn{width:auto}
  .acts .btn{flex:0 0 auto}
}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
</style></head><body>

<header class="top"><a class="logo" href="index.html">Sema<b>Africa</b></a><span class="chip" id="chip" hidden></span></header>
<main class="main"><h1 id="title">Karibu</h1><p class="msg" id="flash" aria-live="polite"></p><div id="view"><p>Loading…</p></div></main>
<nav class="tabs" id="tabs" aria-label="Student menu"></nav>

<dialog id="moreDlg" aria-label="More"><h2>More</h2><div class="more" id="moreBody"></div></dialog>
<dialog id="rsDlg" aria-label="Choose a new time"><div id="rsBody"></div></dialog>
<dialog id="payDlg" aria-label="Pay for a course"><div id="payBody"></div></dialog>

<script>
(function(){
  function f(m){var v=document.getElementById("view"),t=document.getElementById("title");
    if(t){t.textContent="Something went wrong";}
    if(v){v.innerHTML='<div class="empty"><strong></strong><p>Take a screenshot of this message and send it to me. Usual causes: Firestore rules not published, the Firestore database not created, a missing file in the js folder, or wrong Firebase settings.</p></div>';v.querySelector("strong").textContent=m;}}
  addEventListener("unhandledrejection",function(e){f(String(e.reason&&(e.reason.code||e.reason.message)||e.reason))});
  addEventListener("error",function(e){f(e.message||"A script failed to load")});
})();
</script>
<script type="module">
import {auth,db,HOME,WORKER_URL} from "./js/firebase.js";
import * as FB from "./js/firebase.js";
const SERVER_URL=(FB.SERVER_URL||"").replace(/\/+$/,"");
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,updateDoc,collection,query,where,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id), view=$("view");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=v=>v&&v.toDate?v.toDate():null;
const fdt=v=>dt(v).toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const fd=v=>{const d=dt(v);return d?d.toLocaleDateString([],{day:"numeric",month:"short",year:"numeric"}):"–"};
const money=(a,c)=>(c==="KES"?"KES ":"$")+Number(a||0).toLocaleString();
const empty=(t,p,a)=>`<div class="empty"><strong>${t}</strong><p>${p}</p>${a?`<a class="btn" href="${a[1]}"${a[1].length>1&&a[1][0]==="#"?` data-go="${a[1].slice(1)}"`:""}>${a[0]}</a>`:""}</div>`;
const flash=(t,ok=true)=>{$("flash").className="msg "+(ok?"ok":"err");$("flash").textContent=t;if(t)scrollTo({top:0,behavior:"smooth"})};
let uid,me,enr=[],mine=[],openSlots=[],prog=[],pays=[],mats=[],catalog=[],cur="overview";
async function load(){
  const q=(c,f,v)=>getDocs(query(collection(db,c),where(f,"==",v))).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
  const [e,m,o,p,y,m1,m2,cs]=await Promise.all([q("enrollments","userId",uid),q("lessons","studentId",uid),q("lessons","status","open"),q("progress","studentId",uid),q("payments","userId",uid),q("materials","studentId",uid),q("materials","studentId",""),getDocs(collection(db,"courses"))]);
  enr=e;mine=m;catalog=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false).sort((a,b)=>a.usd-b.usd);prog=p.sort((a,b)=>dt(b.date)-dt(a.date));pays=y.sort((a,b)=>dt(b.createdAt)-dt(a.createdAt));
  openSlots=o.filter(l=>dt(l.start)>new Date()).sort((a,b)=>dt(a.start)-dt(b.start));
  const seen={};mats=[...m1,...m2].filter(x=>!seen[x.id]&&(seen[x.id]=1)).sort((a,b)=>(dt(b.createdAt)||0)-(dt(a.createdAt)||0));
  await Promise.all(mine.filter(l=>l.status==="booked"&&dt(l.start).getTime()>Date.now()-45*60000).map(async l=>{
    try{const s=await getDoc(doc(db,"lessonLinks",l.id));if(s.exists())l.meetLink=s.data().meetLink}catch{}}));
}
const usable=()=>enr.filter(e=>e.status==="active"&&e.lessonsLeft>0&&(!e.expiresAt||dt(e.expiresAt)>new Date()));
const credits=()=>usable().reduce((a,e)=>a+e.lessonsLeft,0);
const upcoming=()=>mine.filter(l=>l.status==="booked"&&dt(l.start).getTime()>Date.now()-45*60000).sort((a,b)=>dt(a.start)-dt(b.start));
const join=l=>l.meetLink?`<a class="btn sm" href="${esc(l.meetLink)}" target="_blank" rel="noopener">Join class</a>`:"<small>Link coming soon</small>";
const matRow=m=>`<div class="row"><div><strong>${esc(m.title)}</strong> <span class="pill">${esc(m.type||"Notes")}</span> <span class="pill">${esc(m.level||"All levels")}</span><small>Added ${fd(m.createdAt)}</small></div>
  ${m.link?`<a class="btn line sm" href="${esc(m.link)}" target="_blank" rel="noopener">Watch</a>`:`<button class="btn line sm" data-act="open" data-id="${m.id}">Open</button>`}</div>`;
const PAGES={
overview:["Overview",()=>{const n=upcoming()[0],lv=prog[0];
  return `<p>Hujambo, ${esc(me.name)}! Here is where your learning stands.</p>
  <div class="card hero"><small>Next class</small><h2>${n?fdt(n.start):"None booked"}</h2>${n?join(n):`<a class="btn" href="#" data-go="book">Book a lesson</a>`}</div>
  <div class="g"><div class="card"><small>Lessons left</small><h2>${credits()}</h2></div>
  <div class="card"><small>Your level</small><h2>${lv?esc(lv.level):"Not set"}</h2></div></div>
  <div class="quick"><a class="btn line" href="#" data-go="browse">Browse courses</a></div>`+(enr.length?"":`<div style="margin-top:16px">`+empty("You are not enrolled yet","Choose a plan to unlock live classes, recordings and notes.",["Browse courses","#browse"])+`</div>`)}],
browse:["Browse courses",()=>{
  if(!catalog.length)return empty("No courses are published yet","New courses will appear here. Check back soon.");
  const own=id=>enr.some(e=>e.courseId===id&&e.status==="active"&&e.lessonsLeft>0&&(!e.expiresAt||dt(e.expiresAt)>new Date()));
  return `<p>Pick a plan, pay with M-Pesa, then book your lessons right away.</p><div class="cat">${catalog.map(c=>`<article class="card course"><span class="pill">${esc(c.type)}</span><h3>${esc(c.name)}</h3>
   <small>${c.lessons} lesson${c.lessons>1?"s":""} × ${c.minutes} min${c.type==="Monthly"?" · valid for 30 days":""}</small>
   <div class="pr">KES ${Number(c.kes).toLocaleString()} <small>≈ $${c.usd}</small></div>${c.lessons>1?`<small>About $${(c.usd/c.lessons).toFixed(2)} per lesson</small>`:""}
   ${own(c.id)?'<span class="pill">You have this plan</span>':""}<button class="btn" data-act="enrol" data-id="${c.id}">${own(c.id)?"Buy again":"Enrol with M-Pesa"}</button></article>`).join("")}</div>
   <p style="margin-top:14px"><small>Paying from outside Kenya? Card payments are coming soon.</small></p>`}],
courses:["My enrolled courses",()=>enr.length?enr.map(e=>`<div class="row"><div><strong>${esc(e.courseName)}</strong> <span class="pill">${esc(e.status)}</span><small>${e.lessonsLeft} of ${e.lessonsTotal} lessons left · started ${fd(e.startDate)}${e.expiresAt?" · ends "+fd(e.expiresAt):""}</small></div></div>`).join(""):empty("No courses yet","Once you enrol, your courses appear here.",["Browse courses","#browse"])],
book:["Book a lesson",()=>{
  if(!usable().length)return empty("You need an active plan to book","You have no lessons left. Choose a plan, or ask your teacher if you think this is a mistake.",["Browse courses","#browse"]);
  return `<p>You have <strong>${credits()}</strong> lesson${credits()===1?"":"s"} left. Booking uses one.</p>`+(openSlots.length?openSlots.map(l=>`<div class="row"><div><strong>${fdt(l.start)}</strong><small>${esc(l.teacherName||"Your teacher")} · ${esc(l.type)} · ${l.duration} min</small></div><button class="btn sm" data-act="book" data-id="${l.id}">Book this time</button></div>`).join(""):empty("No open times right now","Your teacher has not published new times yet. Check back soon."))}],
upcoming:["Classes",()=>{const u=upcoming(),past=mine.filter(l=>!u.includes(l)&&dt(l.start)<new Date()).sort((a,b)=>dt(b.start)-dt(a.start));
  return (u.length&&SERVER_URL?`<p><small>Free to cancel or move a class up to ${cancelHrs} hours before it starts. Later changes use the lesson.</small></p>`:"")+(u.length?u.map(l=>`<div class="row"><div><strong>${fdt(l.start)}</strong><small>${esc(l.teacherName||"")} · ${esc(l.type)} · ${l.duration} min</small></div><div class="acts">${join(l)}${SERVER_URL?`<button class="btn line sm" data-act="resched" data-id="${l.id}">Reschedule</button><button class="btn line sm" data-act="cancelLesson" data-id="${l.id}">Cancel</button>`:""}</div></div>`).join(""):empty("No classes scheduled","Book a time and it will show here with your meeting link.",["Book a lesson","#"]))+
  `<h3 class="sec">Past classes</h3>`+(past.length?past.slice(0,30).map(l=>`<div class="row"><div><strong>${fdt(l.start)}</strong> <span class="pill">${esc(l.status)}</span><small>${esc(l.type)}</small></div></div>`).join(""):"<p><small>Nothing yet.</small></p>")}],
progress:["Progress",()=>{const att=mine.filter(l=>l.status==="attended").length;
  return `<div class="g" style="margin-top:0"><div class="card"><small>Current level</small><h2>${prog[0]?esc(prog[0].level):"–"}</h2></div><div class="card"><small>Classes attended</small><h2>${att}</h2></div></div><h3 class="sec">Teacher notes</h3>`+
  (prog.length?prog.map(p=>`<div class="row"><div><strong>${esc(p.topic)}</strong> <span class="pill">${esc(p.level)}</span><small>${fd(p.date)}${p.notes?" · "+esc(p.notes):""}</small></div></div>`).join(""):empty("Nothing recorded yet","After each lesson your teacher adds notes on how you are doing."))}],
notes:["Notes and exercises",()=>{const l=mats.filter(m=>m.type!=="Recording");return l.length?l.map(matRow).join(""):empty("No materials yet","Downloads from your teacher will appear here.")}],
recordings:["Recorded lessons",()=>{const l=mats.filter(m=>m.type==="Recording");return l.length?l.map(matRow).join(""):empty("No recordings yet","Replay links for your classes will appear here.")}],
reminders:["Class reminders",()=>`<p>We remind you before each class so you never miss one.</p>
  <div class="form"><label><span style="display:contents"><input type="checkbox" id="rmE" ${me.remindEmail!==false?"checked":""}> Email me${me.email?" at "+esc(me.email):""}</span></label>
  <label><span style="display:contents"><input type="checkbox" id="rmW" ${me.remindWhatsapp?"checked":""}> Send me a WhatsApp message</span></label>
  <label>WhatsApp number<input id="rmP" type="tel" inputmode="tel" placeholder="07XX XXX XXX or +country code" value="${esc(me.phone||"")}"></label>
  <button class="btn" data-act="saveRem">Save reminders</button></div>
  <p style="margin-top:14px"><small>Reminders arrive about 24 hours and 1 hour before class, in your own time zone. We only message you about your classes.</small></p>`],
payments:["Payment history",()=>pays.length?pays.map(p=>`<div class="row"><div><strong>${money(p.amount,p.currency)}</strong> · ${esc(p.courseName)}<small>${esc(p.method)} ${esc(p.reference||"")} · ${fd(p.createdAt)}</small></div></div>`).join(""):empty("No payments yet","Receipts for your plans will be listed here.")]
};
const ACT={
 async enrol(b){b.disabled=false;openPay(catalog.find(c=>c.id===b.dataset.id))},
 async open(b){const w=window.open("","_blank");try{const r=await fetch(WORKER_URL+"/file/"+b.dataset.id,{headers:{Authorization:"Bearer "+await auth.currentUser.getIdToken()}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||"Could not open that file.")}w.location=URL.createObjectURL(await r.blob())}catch(x){w.close();flash(x.message||"Could not open that file.",false)}b.disabled=false},
 async book(b){const l=openSlots.find(x=>x.id===b.dataset.id),e=usable()[0];if(!l||!e)return;if(!confirm("Book "+fdt(l.start)+"? This uses 1 lesson."))return;
  try{const w=writeBatch(db);
   w.update(doc(db,"lessons",l.id),{status:"booked",studentId:uid,studentName:me.name,enrollmentId:e.id});
   w.update(doc(db,"enrollments",e.id),{lessonsLeft:e.lessonsLeft-1});
   await w.commit();await load();show("upcoming");flash("Booked! Your meeting link is below once your teacher adds it.")}
  catch(x){await load();show("book");flash("Sorry, that time was just taken or is no longer available. Please pick another.",false)}}
};

/* ── M-Pesa payment (server decides the price; the browser only shows it) ── */
let payCourse=null,payId=null,payTimer=null,testMode=false,payAmt=0,payCode="";
const kes=n=>"KES "+Number(n).toLocaleString(), dopen=()=>$("payDlg").open;
async function api(path,method="GET",body){
  const r=await fetch(SERVER_URL+"/api/payments"+path,{method,headers:{"Content-Type":"application/json",Authorization:"Bearer "+await auth.currentUser.getIdToken()},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d}
function openPay(c){
  if(!SERVER_URL){flash("Online payment is being set up. For now, please ask your teacher to enrol you.",false);return}
  payCourse=c;payId=null;payAmt=c.kes;payCode="";drawPay("form");$("payDlg").showModal();
  fetch(SERVER_URL+"/api/health").then(r=>r.json()).then(h=>{testMode=h.mode==="test"}).catch(()=>{});
}
const stopPay=()=>{clearInterval(payTimer);payTimer=null};
function drawPay(step,x={}){
  const c=payCourse,b=$("payBody"),close='<button class="btn line sm" data-p="close" type="button">Close</button>';
  const head=`<h2>${esc(c.name)}</h2><p><small>${c.lessons} lesson${c.lessons>1?"s":""} × ${c.minutes} min</small></p>`;
  const btns='style="display:grid;gap:8px;margin-top:12px"';
  if(step==="form")b.innerHTML=head+`<p style="font:800 2rem var(--display);margin:6px 0 14px" id="pp">${kes(payAmt)}</p>
   <div class="form"><label>M-Pesa phone number<input id="pph" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XX XXX XXX"></label>
   <label>Discount code (optional)<span style="display:flex;gap:8px"><input id="pcd" value="${esc(payCode)}" autocapitalize="characters"><button class="btn line sm" data-p="apply" type="button">Apply</button></span></label></div>
   <p class="msg" id="pm" aria-live="polite" style="margin-top:12px"></p><div ${btns}><button class="btn" data-p="pay" type="button">Pay with M-Pesa</button>${close}</div>`;
  else if(step==="wait")b.innerHTML=head+`<p><strong>Check your phone.</strong> Enter your M-Pesa PIN to pay ${kes(payAmt)}.</p>
   <p class="msg" id="pm" aria-live="polite">${x.late?"Still waiting. If you have paid, tap the button below. If not, close this and try again.":"Waiting for payment…"}</p>
   <div ${btns}><button class="btn" data-p="check" type="button">I have paid, check now</button>${testMode?'<button class="btn line" data-p="sim" type="button">Simulate payment (test mode)</button>':""}${close}</div>
   <p style="margin-top:12px"><small>You can close this window. Your plan appears here as soon as the payment is confirmed.</small></p>`;
  else if(step==="done")b.innerHTML=head+`<p><strong>You are enrolled. Karibu!</strong></p><p>Your lessons are ready to book.</p><div ${btns}><button class="btn" data-p="book" type="button">Book my first lesson</button></div>`;
  else if(step==="fail")b.innerHTML=head+`<p class="msg err">${esc(x.reason||"The payment did not go through.")}</p><div ${btns}><button class="btn" data-p="retry" type="button">Try again</button>${close}</div>`;
}
function poll(){stopPay();let n=0;payTimer=setInterval(async()=>{
  if(++n>45){stopPay();if(dopen())drawPay("wait",{late:true});return}
  try{const s=await api("/status/"+payId);
    if(s.status==="paid")await paid();
    else if(["failed","amount_mismatch"].includes(s.status)){stopPay();dopen()?drawPay("fail",{reason:s.reason}):flash("The payment did not go through.",false)}
  }catch{}},4000)}
async function paid(){stopPay();await load();if(dopen())drawPay("done");else flash("Payment confirmed. You are enrolled!");show(cur)}
$("payDlg").onclick=async e=>{const b=e.target.closest("[data-p]");if(!b)return;const a=b.dataset.p,m=()=>$("pm");
  try{
    if(a==="close")$("payDlg").close();
    else if(a==="retry")drawPay("form");
    else if(a==="book"){$("payDlg").close();show("book")}
    else if(a==="apply"){payCode=$("pcd").value.trim();
      if(!payCode){payAmt=payCourse.kes;$("pp").textContent=kes(payAmt);return}
      const q=await api("/quote","POST",{courseId:payCourse.id,code:payCode});payAmt=q.amount;$("pp").textContent=kes(q.amount);
      m().className="msg ok";m().textContent=q.discount?"Code applied: "+kes(q.discount)+" off.":"Code accepted."}
    else if(a==="pay"){b.disabled=true;payCode=$("pcd").value.trim();
      const d=await api("/initiate","POST",{courseId:payCourse.id,phone:$("pph").value,code:payCode});
      payId=d.paymentId;payAmt=d.amount;drawPay("wait");poll()}
    else if(a==="check"){const s=await api("/status/"+payId);if(s.status==="paid")await paid();else{m().className="msg";m().textContent="Not confirmed yet. M-Pesa can take up to a minute."}}
    else if(a==="sim"){await api("/simulate/"+payId,"POST");await paid()}
  }catch(err){const el=m();if(el){el.className="msg err";el.textContent=err.message}b.disabled=false}};
/* ── cancel and reschedule (the server returns the lesson safely) ── */
let cancelHrs=12;
if(SERVER_URL)fetch(SERVER_URL+"/api/health").then(r=>r.json()).then(h=>{if(h.cancelHours)cancelHrs=h.cancelHours}).catch(()=>{});
async function lapi(path,body){const r=await fetch(SERVER_URL+"/api/lessons"+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await auth.currentUser.getIdToken()},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d}
const isEarly=l=>dt(l.start).getTime()-Date.now()>=cancelHrs*3600000;
Object.assign(ACT,{
  async saveRem(b){const w=$("rmW").checked,p=$("rmP").value.trim();
    if(w&&p.replace(/\D/g,"").length<9){flash("Enter your WhatsApp number, or untick WhatsApp.",false);b.disabled=false;return}
    const d={remindEmail:$("rmE").checked,remindWhatsapp:w,phone:p,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||""};
    await updateDoc(doc(db,"users",uid),d);Object.assign(me,d);flash("Reminder settings saved.");b.disabled=false},
  async cancelLesson(b){const l=mine.find(x=>x.id===b.dataset.id);if(!l){b.disabled=false;return}
    const msg=isEarly(l)?"Cancel this class? Your lesson will be returned to you.":"This class starts in less than "+cancelHrs+" hours, so cancelling will use the lesson. Cancel anyway?";
    if(!confirm(msg)){b.disabled=false;return}
    const d=await lapi("/cancel",{lessonId:l.id});await load();show("upcoming");
    flash(d.refunded?"Class cancelled. Your lesson was returned.":"Class cancelled. The lesson was used because it was too close to the start time.")},
  async resched(b){const l=mine.find(x=>x.id===b.dataset.id);b.disabled=false;if(!l)return;
    if(!isEarly(l)){flash("This class starts in less than "+cancelHrs+" hours, so it can no longer be moved. You can cancel it, but the lesson will be used.",false);return}
    const slots=openSlots.filter(s=>s.id!==l.id);
    $("rsBody").innerHTML=`<h2>Move your class</h2><p><small>Now: ${fdt(l.start)}. Pick a new time and your lesson is kept.</small></p><div style="margin-top:12px">`+
      (slots.length?slots.map(s=>`<div class="row"><div><strong>${fdt(s.start)}</strong><small>${esc(s.teacherName||"")} · ${s.duration} min</small></div><button class="btn sm" data-mv="${s.id}" data-from="${l.id}">Move here</button></div>`).join(""):"<p>No open times right now. Check back soon.</p>")+
      '</div><button class="btn line" style="width:100%" data-close type="button">Close</button>';
    $("rsDlg").showModal()}
});
$("rsDlg").onclick=async e=>{if(e.target.closest("[data-close]"))return $("rsDlg").close();const b=e.target.closest("[data-mv]");if(!b)return;b.disabled=true;
  try{await lapi("/reschedule",{lessonId:b.dataset.from,newLessonId:b.dataset.mv});$("rsDlg").close();await load();show("upcoming");flash("Your class has been moved.")}
  catch(err){$("rsDlg").close();await load();show("upcoming");flash(err.message,false)}};

/* ── navigation: bottom tabs + "More" sheet ── */
const ICON={
  overview:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
  book:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M12 13.5v4M10 15.5h4"/>',
  upcoming:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/>',
  progress:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'
};
const TABS=[["overview","Home"],["book","Book"],["upcoming","Classes"],["progress","Progress"]];
const MORE=["browse","courses","notes","recordings","reminders","payments"];
function buildNav(){
  const t=$("tabs");
  t.innerHTML=TABS.map(([k,l])=>`<button type="button" data-k="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join("")+
    `<button type="button" data-k="more"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON.more}</svg>More</button>`;
  t.onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;flash("");
    if(b.dataset.k==="more"){drawMore();$("moreDlg").showModal()}else show(b.dataset.k)};
  $("moreDlg").onclick=e=>{
    if(e.target===$("moreDlg"))return $("moreDlg").close();
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.out!==undefined)return signOut(auth).then(()=>location.href="index.html");
    $("moreDlg").close();flash("");show(b.dataset.k)};
}
function drawMore(){
  $("moreBody").innerHTML=MORE.map(k=>`<button type="button" data-k="${k}" aria-current="${cur===k}">${PAGES[k][0]}</button>`).join("")+
    '<button type="button" class="out" data-out>Log out</button>';
}
function show(k){cur=k;const [t,h]=PAGES[k];$("title").textContent=t;view.innerHTML=h();
  const inTabs=TABS.some(x=>x[0]===k);
  $("tabs").querySelectorAll("button[data-k]").forEach(x=>x.setAttribute("aria-current",x.dataset.k===k||(x.dataset.k==="more"&&!inTabs)));
  const n=credits(),c=$("chip");c.hidden=false;c.textContent=n+" lesson"+(n===1?"":"s")+" left";
  scrollTo(0,0)}
view.onclick=async e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();return show(g.dataset.go)}
  const a=e.target.closest("a[href='#']");if(a){e.preventDefault();return show("book")}
  const b=e.target.closest("[data-act]");if(!b)return;b.disabled=true;try{await ACT[b.dataset.act](b)}catch(x){flash(x.message&&!x.code?x.message:"That did not work.",false);b.disabled=false}};
onAuthStateChanged(auth,async u=>{
  if(!u)return location.href="auth.html";
  uid=u.uid;const s=await getDoc(doc(db,"users",uid));
  me=s.exists()?s.data():{name:u.displayName||"student",role:"student"};
  if(me.role!=="student")return location.href=HOME[me.role]||HOME.student;
  try{await load()}catch(e){flash("Could not load your data. Check your connection and refresh.",false)}
  buildNav();show("overview");
  const pl=sessionStorage.getItem("sema_plan");
  if(pl){sessionStorage.removeItem("sema_plan");const c=catalog.find(x=>x.id===pl);if(c){show("browse");openPay(c)}}
});
</script></body></html>
