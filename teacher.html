<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355B">
<title>Teacher – SemaAfrica</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Mobile-first teacher dashboard. Self-contained: does not need app.css. */
:root{
  --paper:#F5F6FA;--card:#FFFFFF;--ink:#14213A;--muted:#5D6A82;--line:#DDE2EC;
  --brand:#12355B;--brand-ink:#FFFFFF;--sun:#F2B01E;--leaf:#1B8A5A;--rose:#C2374F;
  --tab-h:64px;--r:16px;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1626;--card:#16223A;--ink:#EEF2FA;--muted:#9AA7C0;--line:#26344F;
  --brand:#8FB8F0;--brand-ink:#0E1626;--sun:#F5BE3F;--leaf:#4FCB8F;--rose:#F0788D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px)}
a{color:var(--brand);font-weight:700}
small{display:block;color:var(--muted);font-size:.84rem;line-height:1.4}
h1,h2,h3{margin:0}

.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:repeating-linear-gradient(90deg,var(--sun) 0 18px,var(--leaf) 18px 36px,var(--rose) 36px 54px,var(--brand) 54px 72px)}
.logo{font:800 1.25rem var(--display);color:inherit;text-decoration:none;letter-spacing:-.01em}
.logo b{color:var(--sun)}
.chip{font:700 .85rem var(--body);background:rgba(255,255,255,.16);color:inherit;border-radius:99px;padding:5px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){.chip{background:rgba(14,22,38,.14)}}

.main{max-width:720px;margin:0 auto;padding:22px 16px 8px}
#title{font:800 1.75rem/1.15 var(--display);letter-spacing:-.02em;margin-bottom:14px}
.msg{margin:0 0 12px;font-weight:700}
.msg:empty{display:none}
.msg.ok,.msg.err{padding:12px 14px;border-radius:12px;font-size:.95rem}
.msg.ok{background:color-mix(in srgb,var(--leaf) 16%,var(--card));border:1px solid var(--leaf)}
.msg.err{background:color-mix(in srgb,var(--rose) 14%,var(--card));border:1px solid var(--rose)}
#view>p{margin:0 0 14px}

.card,.row,.empty,.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;flex-direction:column;gap:12px;padding:14px;margin-bottom:10px}
.row .pill{vertical-align:middle}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .btn{flex:1 1 auto}
.row>.btn{width:100%}
.pill{display:inline-block;font:700 .75rem/1 var(--body);padding:5px 9px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,var(--card));color:var(--ink);margin-left:4px}
.empty{padding:22px 18px;border-style:dashed}
.empty strong{display:block;font:700 1.15rem var(--display);margin-bottom:4px}
.empty p{margin:0;color:var(--muted)}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;
  border:2px solid var(--brand);border-radius:12px;background:var(--brand);color:var(--brand-ink);
  font:700 1rem var(--body);text-decoration:none;cursor:pointer;text-align:center}
.btn.line{background:transparent;color:var(--brand)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.95rem}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* forms */
.form{display:grid;gap:14px;margin-bottom:14px}
label{display:grid;gap:6px;font-weight:700;min-width:0}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-width:0;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font:400 1rem var(--body)}
textarea{min-height:96px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.form label:has(input[type=checkbox]){display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:44px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;font-weight:600;color:var(--muted);background:var(--card)}
.add{margin-bottom:16px}
.add>summary{list-style:none;width:100%}
.add>summary::-webkit-details-marker{display:none}
.add[open]>summary{margin-bottom:14px}
.add .form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0}

/* week agenda */
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.nav2 strong{grid-column:1/-1;order:-1;text-align:center;font:700 1.05rem var(--display)}
.nav2 .btn:last-child{grid-column:1/-1}
.week{display:grid;gap:10px}
.day{padding:12px 14px}
.day h3{font:700 1rem var(--display)}
.day.today{border-color:var(--sun);box-shadow:inset 4px 0 0 var(--sun)}
.day .none{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.slot{margin-top:8px;padding:9px 12px;border-left:4px solid var(--brand);border-radius:6px 10px 10px 6px;
  background:color-mix(in srgb,var(--brand) 8%,var(--card));line-height:1.35}
.slot.open{border-left-color:var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--card))}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:700 .72rem var(--body);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:6px 2px;cursor:pointer;position:relative}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=true]{color:var(--brand)}
.tabs button[aria-current=true]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--sun)}

dialog{border:0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:90dvh;overflow:auto;
  margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,26,.6)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
dialog h2{font:800 1.4rem var(--display)}
.more{display:grid;gap:8px;margin-top:12px}
.more button{appearance:none;width:100%;text-align:left;min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);font:700 1rem var(--body);cursor:pointer}
.more button[aria-current=true]{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.more .out{color:var(--rose);margin-top:6px}
@media (min-width:600px){
  dialog{margin:auto;border-radius:22px}
  .row{flex-direction:row;align-items:center;justify-content:space-between}
  .row>.btn{width:auto}
  .acts .btn{flex:0 0 auto}
  .nav2{display:flex;align-items:center}
  .nav2 strong{order:0;flex:1}
  .nav2 .btn:last-child{grid-column:auto}
  .form{grid-template-columns:1fr 1fr}
  .form .full,.form .btn,.form .msg{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
</style></head><body>

<header class="top"><a class="logo" href="index.html">Sema<b>Africa</b></a><span class="chip" id="chip" hidden></span></header>
<main class="main"><h1 id="title"></h1><p class="msg" id="flash" aria-live="polite"></p><div id="view"><p>Loading…</p></div></main>
<nav class="tabs" id="tabs" aria-label="Teacher menu"></nav>
<dialog id="moreDlg" aria-label="More"><h2>More</h2><div class="more" id="moreBody"></div></dialog>

<script>
(function(){
  function f(m){var v=document.getElementById("view"),t=document.getElementById("title");
    if(t){t.textContent="Something went wrong";}
    if(v){v.innerHTML='<div class="empty"><strong></strong><p>Take a screenshot of this message and send it to me. Usual causes: Firestore rules not published, the Firestore database not created, a missing file in the js folder, or wrong Firebase settings.</p></div>';v.querySelector("strong").textContent=m;}}
  addEventListener("unhandledrejection",function(e){f(String(e.reason&&(e.reason.code||e.reason.message)||e.reason))});
  addEventListener("error",function(e){f(e.message||"A script failed to load")});
})();
</script>
<script type="module">
import {auth,db,HOME,WORKER_URL} from "./js/firebase.js";
import * as FB from "./js/firebase.js";
const SERVER_URL=(FB.SERVER_URL||"").replace(/\/+$/,"");
async function staffCancel(id){const r=await fetch(SERVER_URL+"/api/lessons/staff-cancel",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await auth.currentUser.getIdToken()},body:JSON.stringify({lessonId:id})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Could not cancel");return d}
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,setDoc,collection,query,where,getDocs,addDoc,updateDoc,Timestamp,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id), view=$("view");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=l=>l.start.toDate(), fd=d=>d.toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"}), ft=d=>d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const mon=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const ST={open:"Open slot",booked:"Booked",attended:"Attended",absent:"Absent",cancelled:"Cancelled"};
const empty=(t,p)=>`<div class="empty"><strong>${t}</strong><p>${p}</p></div>`;
const note=(t,ok=true)=>{$("flash").className="msg "+(ok?"ok":"err");$("flash").textContent=t;if(t)scrollTo({top:0,behavior:"smooth"})};
let links={},uid,me,students=[],lessons=[],mats=[],prog=[],week=mon(new Date()),cur="timetable",pick="";
const nameOf=id=>(students.find(s=>s.id===id)||{}).name||"";
const opts=(sel)=>students.map(s=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${esc(s.name)}</option>`).join("");

async function load(){
  const own=c=>getDocs(query(collection(db,c),where("teacherId","==",uid))).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
  let lk=[];[lessons,mats,prog,lk]=await Promise.all([own("lessons"),own("materials"),own("progress"),own("lessonLinks")]);links={};lk.forEach(x=>links[x.id]=x.meetLink);
  lessons.sort((a,b)=>T(a)-T(b));
  prog.sort((a,b)=>b.date.toMillis()-a.date.toMillis());
  students=(await getDocs(query(collection(db,"users"),where("role","==","student")))).docs.map(d=>({id:d.id,...d.data()}));
}
const lessonRow=(l,acts="")=>`<div class="row"><div><strong>${fd(T(l))}, ${ft(T(l))}</strong> <span class="pill">${ST[l.status]||l.status}</span>
  <small>${esc(l.studentName||"No student yet")} · ${esc(l.type)} · ${l.duration} min</small></div><div class="acts">${(links[l.id]||l.meetLink)?`<a class="btn line sm" href="${esc(links[l.id]||l.meetLink)}" target="_blank" rel="noopener">Join</a>`:""}${acts}</div></div>`;
const btn=(a,id,t,line=true)=>`<button class="btn sm ${line?"line":""}" data-act="${a}" data-id="${id}">${t}</button>`;

let qu=[];
const TYPES=["Notes","Exercise","Audio","Recording","Other"],LEVELS=["All levels","A1 Beginner","A2 Elementary","B1 Intermediate","B2 Upper intermediate"];
const sel=(arr,v,i,k)=>`<select data-i="${i}" data-k="${k}">${arr.map(a=>`<option ${a===v?"selected":""}>${a}</option>`).join("")}</select>`;
function drawQ(){const q=$("qL");if(!q)return;q.innerHTML=qu.map((x,i)=>`<div class="row" style="display:grid;gap:8px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><small>${esc(x.f.name)} · ${x.st==="uploading"?"Uploading…":x.st==="error"?"Failed: "+esc(x.err):"Ready"}</small><button class="btn line sm" data-rm="${i}" type="button">Remove</button></div>
 <div class="form" style="margin:0;padding:0"><label>Title<input data-i="${i}" data-k="title" value="${esc(x.title)}"></label><label>Type${sel(TYPES,x.type,i,"type")}</label><label>Level${sel(LEVELS,x.level,i,"level")}</label><label>Free for everyone<input type="checkbox" data-i="${i}" data-k="free" ${x.free?"checked":""}></label></div></div>`).join("")}
const PAGES={
students:["Students",()=>{
  const att=id=>lessons.filter(l=>l.studentId===id&&l.status==="attended").length;
  return `<div class="form"><label class="full">Search<input id="q" placeholder="Type a name or email"></label></div><div id="list">${students.length?students.map(s=>`<div class="row" data-s="${esc((s.name+s.email).toLowerCase())}"><div><strong>${esc(s.name)}</strong><small>${esc(s.email)}${s.goal?" · "+esc(s.goal):""} · ${att(s.id)} lessons attended</small></div>
   <div class="acts">${btn("prog",s.id,"Record progress")}</div></div>`).join(""):empty("No students yet","Students appear here after they create an account.")}</div>`},
 ()=>{const q=$("q");if(q)q.oninput=()=>document.querySelectorAll("[data-s]").forEach(r=>r.hidden=!r.dataset.s.includes(q.value.toLowerCase()))}],
timetable:["This week",()=>{
  const days=[...Array(7)].map((_,i)=>{const d=new Date(week);d.setDate(d.getDate()+i);return d});
  const today=new Date().toDateString();
  return `<details class="add"><summary class="btn">Add a slot</summary><form class="form" id="slotF"><label>Date<input type="date" id="sd" required></label><label>Time<input type="time" id="st" required></label>
  <label>Length<select id="sl"><option>25</option><option selected>45</option></select></label>
  <label>Type<select id="sy"><option>Trial lesson</option><option selected>Single lesson</option><option>Monthly plan lesson</option></select></label>
  <label>Student (optional)<select id="ss"><option value="">Open slot</option>${opts()}</select></label>
  <label>Meeting link<input id="sm" type="url" placeholder="https://meet.google.com/…"></label>
  <button class="btn">Add to timetable</button><p class="msg full" id="m"></p></form></details>
  <div class="nav2">${btn("prev","","Previous")}<strong>${fd(days[0])} – ${fd(days[6])}</strong>${btn("next","","Next")}${btn("today","","Back to this week")}</div>
  <div class="week">${days.map(d=>{const ls=lessons.filter(l=>T(l).toDateString()===d.toDateString());
   return `<div class="day${d.toDateString()===today?" today":""}"><h3>${fd(d)}</h3>${ls.length?ls.map(l=>`<div class="slot ${l.status==="open"?"open":""}"><strong>${ft(T(l))}</strong> · ${l.duration} min<br>${esc(l.studentName||"Open slot")}</div>`).join(""):'<p class="none">No lessons</p>'}</div>`}).join("")}</div>`},
 ()=>{$("slotF").onsubmit=async e=>{e.preventDefault();const s=$("ss").value;
   const ml=$("sm").value.trim();if(ml&&!/^https:\/\//.test(ml)){$("m").className="msg err";$("m").textContent="The meeting link must start with https://";return}
   const lr=doc(collection(db,"lessons"));
   await setDoc(lr,{teacherId:uid,teacherName:me.name,studentId:s,studentName:nameOf(s),start:Timestamp.fromDate(new Date($("sd").value+"T"+$("st").value)),duration:+$("sl").value,type:$("sy").value,status:s?"booked":"open"});
   if(ml)await setDoc(doc(db,"lessonLinks",lr.id),{teacherId:uid,meetLink:ml});
   await refresh("Added to your timetable.")}}],
upcoming:["Upcoming",()=>{const now=Date.now();
  const l=lessons.filter(x=>T(x)>=now&&["open","booked"].includes(x.status));
  return l.length?l.map(x=>lessonRow(x,btn("cancelled",x.id,"Cancel"))).join(""):empty("No upcoming lessons","Add slots in This week.")}],
materials:["Files",()=>`<div class="form"><label class="drop full">Tap to choose files<br><small>PDF, Word, audio or images, up to 25 MB each</small><input type="file" id="mf" multiple hidden></label>
  <label class="full">Share with<select id="ms"><option value="">All my students</option>${opts()}</select></label>
  <button class="btn" id="upAll" type="button">Upload all</button><p class="msg full" id="m"></p></div><div id="qL"></div>
  <form class="form" id="lkF"><label class="full"><strong>Or add a recording link (unlisted YouTube or Vimeo)</strong></label><label>Title<input id="lt" required></label><label>Link<input id="lu" type="url" placeholder="https://…" required></label><button class="btn">Add link</button></form>
  <h2 style="margin:22px 0 10px;font:700 1.2rem var(--display)">Uploaded</h2>`+
  (mats.length?mats.map(m=>`<div class="row"><div><strong>${esc(m.title)}</strong> <span class="pill">${esc(m.type||"Notes")}</span> <span class="pill">${esc(m.level||"All levels")}</span>${m.free?' <span class="pill">Free</span>':""}<small>${m.studentName?esc(m.studentName):"All my students"}</small></div>${m.link?`<a class="btn line sm" href="${esc(m.link)}" target="_blank" rel="noopener">Watch</a>`:btn("open",m.id,"Open")}</div>`).join(""):empty("Nothing uploaded","Notes and exercises you upload show up for your students.")),
 ()=>{drawQ();
  $("lkF").onsubmit=async e=>{e.preventDefault();const u=$("lu").value.trim();if(!/^https:\/\//.test(u)){$("m").className="msg err";$("m").textContent="The link must start with https://";return}const s=$("ms").value;
   await addDoc(collection(db,"materials"),{teacherId:uid,title:$("lt").value.trim(),type:"Recording",level:"All levels",free:false,link:u,studentId:s,studentName:nameOf(s),createdAt:serverTimestamp()});await refresh("Link added.")};
  $("mf").onchange=e=>{[...e.target.files].forEach(f=>{if(f.size>25*1048576){$("m").className="msg err";$("m").textContent=f.name+" is over 25 MB and was skipped.";return}
    qu.push({f,title:f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," "),type:"Notes",level:"All levels",free:false,st:"ready"})});e.target.value="";drawQ()};
  $("qL").oninput=e=>{const t=e.target,i=t.dataset.i;if(i!==undefined)qu[i][t.dataset.k]=t.type==="checkbox"?t.checked:t.value};
  $("qL").onclick=e=>{const b=e.target.closest("[data-rm]");if(b){qu.splice(+b.dataset.rm,1);drawQ()}};
  $("upAll").onclick=async()=>{const todo=qu.filter(x=>x.st!=="done");if(!todo.length)return;$("upAll").disabled=true;const s=$("ms").value;
   for(const x of todo){x.st="uploading";drawQ();
    try{const tok=await auth.currentUser.getIdToken();
     const up=await fetch(WORKER_URL+"/upload",{method:"PUT",headers:{Authorization:"Bearer "+tok,"X-File-Name":encodeURIComponent(x.f.name),"Content-Type":x.f.type||"application/octet-stream"},body:x.f});
     if(!up.ok)throw new Error((await up.json().catch(()=>({}))).error||up.status);
     const {key}=await up.json();
     await addDoc(collection(db,"materials"),{teacherId:uid,title:x.title.trim()||x.f.name,type:x.type,level:x.level,free:x.free,fileKey:key,fileName:x.f.name,studentId:s,studentName:nameOf(s),createdAt:serverTimestamp()});
     x.st="done"}catch(err){x.st="error";x.err=err.message}
    drawQ()}
   const ok=qu.filter(x=>x.st==="done").length;qu=qu.filter(x=>x.st!=="done");
   await load();show("materials");note(ok+" uploaded"+(qu.length?", "+qu.length+" failed. Fix and try again.":"."),!qu.length)}}],
progress:["Student progress",()=>`<form class="form" id="pF"><label>Student<select id="ps" required><option value="">Choose…</option>${opts(pick)}</select></label>
  <label>Level<select id="pl"><option>Beginner (A1)</option><option>Elementary (A2)</option><option>Intermediate (B1)</option><option>Upper intermediate (B2)</option></select></label>
  <label class="full">Topic covered<input id="pt" required></label><label class="full">Notes (strengths, what to practise)<textarea id="pn"></textarea></label>
  <button class="btn">Save progress</button><p class="msg full" id="m"></p></form>`+
  (prog.length?prog.slice(0,25).map(p=>`<div class="row"><div><strong>${esc(p.studentName)}</strong> <span class="pill">${esc(p.level)}</span><small>${fd(p.date.toDate())} · ${esc(p.topic)}<br>${esc(p.notes)}</small></div></div>`).join(""):empty("No records yet","Record what each student covered after a lesson.")),
 ()=>{$("pF").onsubmit=async e=>{e.preventDefault();const s=$("ps").value;if(!s)return;
   await addDoc(collection(db,"progress"),{teacherId:uid,studentId:s,studentName:nameOf(s),level:$("pl").value,topic:$("pt").value.trim(),notes:$("pn").value.trim(),date:Timestamp.now()});
   pick="";await refresh("Progress saved.")}}],
history:["Attendance",()=>{const now=Date.now();
  const l=lessons.filter(x=>T(x)<now).reverse();
  const n=s=>l.filter(x=>x.status===s).length;
  return `<p><strong>${n("attended")}</strong> attended · <strong>${n("absent")}</strong> absent · <strong>${n("cancelled")}</strong> cancelled</p>`+
  (l.length?l.map(x=>lessonRow(x,x.status==="booked"?btn("attended",x.id,"Attended",false)+btn("absent",x.id,"Absent"):"")).join(""):empty("No past lessons","Completed lessons will be listed here."))}]
};
async function refresh(msg){await load();show(cur);if(msg)note(msg)}

/* ── navigation: bottom tabs + "More" sheet ── */
const ICON={
  timetable:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
  upcoming:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  students:'<circle cx="9" cy="8.5" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.6a3.2 3.2 0 0 1 0 5.8M18 14.8c2 .6 3.4 2.3 3.4 5.2"/>',
  materials:'<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H10l2 2.5h5.5A2.5 2.5 0 0 1 20 9v8.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/>',
  more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'
};
const TABS=[["timetable","Week"],["upcoming","Upcoming"],["students","Students"],["materials","Files"]];
const MORE=["progress","history"];
function buildNav(){
  const t=$("tabs");
  t.innerHTML=TABS.map(([k,l])=>`<button type="button" data-k="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join("")+
    `<button type="button" data-k="more"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON.more}</svg>More</button>`;
  t.onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;note("");
    if(b.dataset.k==="more"){drawMore();$("moreDlg").showModal()}else show(b.dataset.k)};
  $("moreDlg").onclick=e=>{
    if(e.target===$("moreDlg"))return $("moreDlg").close();
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.out!==undefined)return signOut(auth).then(()=>location.href="index.html");
    $("moreDlg").close();note("");show(b.dataset.k)};
}
function drawMore(){
  $("moreBody").innerHTML=MORE.map(k=>`<button type="button" data-k="${k}" aria-current="${cur===k}">${PAGES[k][0]}</button>`).join("")+
    '<button type="button" class="out" data-out>Log out</button>';
}
function show(k){cur=k;const [t,h,b]=PAGES[k];$("title").textContent=t;view.innerHTML=h();if(b)b();
  const inTabs=TABS.some(x=>x[0]===k);
  $("tabs").querySelectorAll("button[data-k]").forEach(x=>x.setAttribute("aria-current",x.dataset.k===k||(x.dataset.k==="more"&&!inTabs)));
  const n=lessons.filter(x=>T(x)>=Date.now()&&["open","booked"].includes(x.status)).length,c=$("chip");c.hidden=false;c.textContent=n+" upcoming";
  scrollTo(0,0)}
view.onclick=async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="prev"||a==="next"){week.setDate(week.getDate()+(a==="next"?7:-7));return show("timetable")}
  if(a==="today"){week=mon(new Date());return show("timetable")}
  if(a==="prog"){pick=id;return show("progress")}
  if(a==="open"){const w=window.open("","_blank");try{const r=await fetch(WORKER_URL+"/file/"+id,{headers:{Authorization:"Bearer "+await auth.currentUser.getIdToken()}});if(!r.ok)throw 0;w.location=URL.createObjectURL(await r.blob())}catch{w.close();alert("Could not open the file.")}return}
  if(a==="cancelled"&&SERVER_URL){if(!confirm("Cancel this lesson? A booked student gets their lesson back."))return;b.disabled=true;try{await staffCancel(id);await refresh("Lesson cancelled.")}catch(x){alert(x.message);b.disabled=false}return}
  b.disabled=true;await updateDoc(doc(db,"lessons",id),{status:a});await refresh()};
onAuthStateChanged(auth,async u=>{
  if(!u)return location.href="auth.html";
  uid=u.uid;const s=await getDoc(doc(db,"users",uid));me=s.exists()?s.data():{role:"student"};
  if(me.role!=="teacher")return location.href=HOME[me.role]||HOME.student;
  await load();buildNav();show("timetable");
});
</script></body></html>
